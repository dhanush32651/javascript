Students data entry & display :
-------------------------------
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Data Management</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        form { margin-bottom: 20px; padding: 15px; border: 1px solid #ccc; border-radius: 5px; }
        label { display: block; margin-bottom: 5px; }
        input[type="text"], input[type="number"] { width: 100%; padding: 8px; margin-bottom: 10px; border: 1px solid #ddd; border-radius: 4px; }
        button { padding: 10px 15px; background-color: #4CAF50; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background-color: #45a049; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
    </style>
</head>
<body>
    <h1>Student Data Entry</h1>

    <form id="studentForm">
        <label for="studentName">Student Name:</label>
        <input type="text" id="studentName" required>

        <label for="studentAge">Age:</label>
        <input type="number" id="studentAge" required>

        <label for="studentGrade">Grade:</label>
        <input type="text" id="studentGrade" required>

        <button type="submit">Add Student</button>
    </form>

    <h2>Student List</h2>
    <table id="studentTable">
        <thead>
            <tr>
                <th>Name</th>
                <th>Age</th>
                <th>Grade</th>
            </tr>
        </thead>
        <tbody>
            <!-- Student data will be inserted here by JavaScript -->
        </tbody>
    </table>

    <script>
        document.getElementById('studentForm').addEventListener('submit', function(event) {
            event.preventDefault(); // Prevent default form submission

            const studentName = document.getElementById('studentName').value;
            const studentAge = document.getElementById('studentAge').value;
            const studentGrade = document.getElementById('studentGrade').value;

            if (studentName && studentAge && studentGrade) {
                const tableBody = document.querySelector('#studentTable tbody');
                const newRow = tableBody.insertRow();

                const nameCell = newRow.insertCell();
                const ageCell = newRow.insertCell();
                const gradeCell = newRow.insertCell();

                nameCell.textContent = studentName;
                ageCell.textContent = studentAge;
                gradeCell.textContent = studentGrade;

                // Clear the form fields
                document.getElementById('studentName').value = '';
                document.getElementById('studentAge').value = '';
                document.getElementById('studentGrade').value = '';
            } else {
                alert('Please fill in all fields.');
            }
        });
    </script>
</body>
</html>
